name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AI_ENABLED: "false"
      JWT_SECRET_KEY: timberops-ci-only-jwt-secret-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check . ../scripts
      - name: Pytest and coverage baseline
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check and production build
        run: npm run build

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timberops
          POSTGRES_USER: timberops
          POSTGRES_PASSWORD: timberops_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timberops -d timberops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://timberops:timberops_ci_password@localhost:5432/timberops
      JWT_SECRET_KEY: timberops-ci-only-jwt-secret-at-least-32-characters
      AI_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Upgrade an empty database
        run: python -m alembic upgrade head
      - name: Check ORM and migration head
        run: python -m alembic check

  configuration-check:
    name: Configuration and Docker Build
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: timberops
      POSTGRES_USER: timberops
      POSTGRES_PASSWORD: timberops_ci_password
      DATABASE_URL_DOCKER: postgresql+psycopg://timberops:timberops_ci_password@db:5432/timberops
      JWT_SECRET_KEY: timberops-ci-only-jwt-secret-at-least-32-characters
      PUBLIC_REGISTRATION_ENABLED: "false"
      AI_ENABLED: "false"
      FRONTEND_PORT: "8080"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Security check
        run: python scripts/security_check.py
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build --tag timberops-backend:ci backend
      - name: Build frontend image
        run: docker build --tag timberops-frontend:ci frontend
